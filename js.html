
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Practical Programs</title>
</head>
<body>

    <h1>JavaScript Practical Programs</h1>

    <h2>1. Variables using var, let, and const</h2>

    <script>
        var name = "Nithin";
        let age = 20;
        const country = "India";

        console.log("Name: " + name);
        console.log("Age: " + age);
        console.log("Country: " + country);
    </script>

    <hr>

    <h2>2. JavaScript Data Types</h2>

    <script>
        let studentName = "Nithin";
        let studentAge = 20;
        let isStudent = true;
        let address = null;
        let result;

        console.log("String: " + studentName);
        console.log("Number: " + studentAge);
        console.log("Boolean: " + isStudent);
        console.log("Null: " + address);
        console.log("Undefined: " + result);
    </script>

    <hr>

    <h2>3. What is JavaScript?</h2>

    <p>JavaScript is a programming language used to make websites interactive.</p>

    <script>
        document.write("Welcome to JavaScript!");
    </script>

    <hr>

    <h2>4. Print Hello JS</h2>

    <script>
        document.write("<p>Hello JS</p>");
    </script>

    <hr>

    <h2>5. Log Name and Age in Console</h2>

    <script>
        let myName = "Nithin";
        let myAge = 20;

        console.log("My name is " + myName);
        console.log("My age is " + myAge);
    </script>

    <p>Open the browser console to see the output.</p>

</body>
</html>
