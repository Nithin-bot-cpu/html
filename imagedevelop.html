
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get In Touch</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: Arial, sans-serif;
    padding: 30px 20px;
}

.contact-wrapper {
    width: 100%;
    max-width: 1050px;
    min-height: 500px;
    background: #7061ed;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 45px 7%;
}

/* Background decorations */
.shape {
    position: absolute;
    background: #4936ee;
}

.circle {
    width: 45px;
    height: 45px;
    border-radius: 50%;
}

.circle.one {
    top: 25px;
    left: 30px;
}

.circle.two {
    bottom: -15px;
    left: 10px;
    width: 70px;
    height: 70px;
}

.square {
    width: 50px;
    height: 75px;
    right: 0;
    top: 170px;
}

.triangle {
    position: absolute;
    top: 15px;
    right: 28%;
    width: 0;
    height: 0;
    border-left: 30px solid transparent;
    border-right: 30px solid transparent;
    border-bottom: 35px solid #4936ee;
}

.dots {
    position: absolute;
    display: grid;
    grid-template-columns: repeat(3, 7px);
    gap: 10px;
    top: 10px;
    left: 37%;
}

.dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #261c66;
}

/* Main card */
.contact-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 900px;
    min-height: 400px;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(28, 16, 95, 0.15);
}

/* Left section */
.left-panel {
    background: #fff5eb;
    padding: 35px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.illustration {
    width: 100%;
    max-width: 390px;
    margin: auto;
    display: block;
}

.left-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
}

.left-bottom h1 {
    color: #29205e;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: -1px;
}

.arrow {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #ffd16c;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 32px;
}

/* Right section */
.right-panel {
    background: #29205f;
    padding: 38px 13%;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    color: #e9dafa;
    font-size: 10px;
    font-weight: bold;
    margin-bottom: 6px;
    text-transform: uppercase;
}

.form-group input,
.form-group textarea {
    width: 100%;
    border: none;
    outline: none;
    border-radius: 6px;
    padding: 10px 12px;
    background: #f9e8fa;
    color: #29205f;
    font-size: 11px;
    transition: box-shadow 0.3s;
}

.form-group input {
    height: 34px;
}

.form-group textarea {
    height: 85px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus {
    box-shadow: 0 0 0 3px #a18aff;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: #b7a5d9;
}

.submit-btn {
    width: 100%;
    padding: 13px;
    background: #7564f3;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    background: #9587ff;
    transform: translateY(-2px);
}

#form-message {
    margin-top: 12px;
    color: #b9ffcf;
    font-size: 12px;
    text-align: center;
    min-height: 15px;
}

/* Responsive design */
@media (max-width: 700px) {
    body {
        padding: 15px;
    }

    .contact-wrapper {
        padding: 30px 15px;
    }

    .contact-card {
        grid-template-columns: 1fr;
    }

    .left-panel {
        min-height: 330px;
        padding: 25px;
    }

    .illustration {
        max-width: 280px;
    }

    .right-panel {
        padding: 35px 25px;
    }
}

@media (max-width: 380px) {
    .left-bottom h1 {
        font-size: 21px;
    }

    .left-panel {
        min-height: 280px;
    }
}
</style>
</head>

<body>

<div class="contact-wrapper">

    <!-- Decorative shapes -->
    <div class="shape circle one"></div>
    <div class="shape circle two"></div>
    <div class="shape square"></div>
    <div class="triangle"></div>

    <div class="dots">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
    </div>

    <!-- Main card -->
    <div class="contact-card">

        <!-- LEFT PANEL -->
        <div class="left-panel">

            <svg class="illustration"
                 viewBox="0 0 400 300"
                 xmlns="http://www.w3.org/2000/svg">

                <!-- Background circles -->
                <circle cx="200" cy="155" r="125"
                        fill="#ffedcc"/>
                <circle cx="65" cy="50" r="22"
                        fill="#ffe9c8"/>
                <circle cx="335" cy="120" r="13"
                        fill="#ffe9c8"/>
                <circle cx="55" cy="255" r="11"
                        fill="#ffd16c"/>

                <!-- Regards badge -->
                <rect x="125" y="5" width="105" height="30"
                      rx="7" fill="#f4c9ed"/>
                <text x="135" y="25" font-size="17"
                      fill="#ff5149">♥</text>
                <text x="160" y="25" font-size="12"
                      font-weight="bold" fill="#29205f">
                    REGARDS
                </text>

                <!-- Laptop screen -->
                <rect x="85" y="115" width="230" height="130"
                      rx="10" fill="#29205f"/>
                <rect x="97" y="128" width="206" height="105"
                      fill="#c6a0e2"/>

                <!-- Laptop keyboard -->
                <path d="M85 245 L315 245 L345 270
                         Q345 278 335 278 H65
                         Q55 278 60 270 Z"
                      fill="#29205f"/>

                <path d="M90 249 H310"
                      stroke="#fff0dc" stroke-width="5"/>
                <path d="M115 260 H285"
                      stroke="#fff0dc" stroke-width="5"/>

                <!-- Envelope -->
                <rect x="140" y="151" width="100" height="58"
                      fill="#fff1d9"/>
                <path d="M140 151 L190 185 L240 151"
                      fill="none" stroke="#66518e" stroke-width="2"/>
                <path d="M140 209 L190 177 L240 209"
                      fill="none" stroke="#66518e" stroke-width="2"/>

                <!-- Chat bubble -->
                <rect x="65" y="80" width="65" height="43"
                      rx="7" fill="#ffd16c"/>
                <path d="M95 123 L105 138 L105 123"
                      fill="#ffd16c"/>
                <circle cx="85" cy="101" r="3" fill="#29205f"/>
                <circle cx="97" cy="101" r="3" fill="#29205f"/>
                <circle cx="109" cy="101" r="3" fill="#29205f"/>

                <!-- 24/7 badge -->
                <rect x="230" y="65" width="85" height="65"
                      rx="7" fill="#7564f3"/>
                <path d="M230 80 H315"
                      stroke="#fff" stroke-width="2"/>
                <circle cx="240" cy="73" r="2" fill="white"/>
                <circle cx="250" cy="73" r="2" fill="white"/>
                <circle cx="260" cy="73" r="2" fill="white"/>
                <text x="238" y="112" font-size="26"
                      font-weight="bold" fill="white">24/7</text>

                <!-- Globe -->
                <circle cx="85" cy="196" r="27" fill="#7564f3"/>
                <circle cx="85" cy="196" r="17"
                        fill="none" stroke="white"/>
                <ellipse cx="85" cy="196" rx="8" ry="17"
                         fill="none" stroke="white"/>
                <path d="M68 196 H102 M72 186 H98 M72 206 H98"
                      stroke="white" fill="none"/>

                <!-- Share button -->
                <circle cx="295" cy="208" r="25" fill="#ffd16c"/>
                <path d="M286 208 L303 198 M286 208 L303 218"
                      stroke="#29205f" stroke-width="2"/>
                <circle cx="285" cy="208" r="4" fill="#29205f"/>
                <circle cx="304" cy="196" r="4" fill="#29205f"/>
                <circle cx="304" cy="220" r="4" fill="#29205f"/>

                <!-- Small decorative dots -->
                <circle cx="35" cy="115" r="4" fill="#d5a5ed"/>
                <circle cx="350" cy="185" r="7" fill="#d5a5ed"/>
                <circle cx="75" cy="245" r="4" fill="#d5a5ed"/>
                <circle cx="335" cy="260" r="4" fill="#d5a5ed"/>
                <circle cx="250" cy="35" r="4" fill="#d5a5ed"/>

            </svg>

            <div class="left-bottom">
                <h1>GET IN TOUCH</h1>
                <div class="arrow">➜</div>
            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">

            <form id="contactForm">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name"
                           placeholder="Full Name" required>
                </div>

                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company"
                           placeholder="Company name">
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone"
                           placeholder="Phone number">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           placeholder="Your best email address"
                           required>
                </div>

                <div class="form-group">
                    <label for="subject">Message Subject</label>
                    <input type="text" id="subject"
                           placeholder="Briefly describe the subject"
                           required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message"
                              placeholder="Write your message here."
                              required></textarea>
                </div>

                <button class="submit-btn" type="submit">
                    SEND MESSAGE
                </button>

                <p id="form-message" aria-live="polite"></p>

            </form>

        </div>
    </div>
</div>

<script>
const contactForm = document.getElementById("contactForm");
const formMessage = document.getElementById("form-message");

contactForm.addEventListener("submit", function(event) {
    event.preventDefault();

    if (!contactForm.checkValidity()) {
        contactForm.reportValidity();
        return;
    }

    const contactData = {
        name: document.getElementById("name").value,
        company: document.getElementById("company").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        subject: document.getElementById("subject").value,
        message: document.getElementById("message").value
    };

    console.log("Contact Form Data:", contactData);

    formMessage.textContent =
        "Thank you! Your message is ready.";

    contactForm.reset();
});
</script>

</body>
</html>
